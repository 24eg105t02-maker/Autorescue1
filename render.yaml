services:
  # Spring Boot Java 21 Backend Web Service
  - type: web
    name: autorescue-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: autorescue-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  # React Vite Frontend (Static Site)
  - type: web
    name: autorescue-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://autorescue-backend-koso.onrender.com/api

databases:
  # Managed PostgreSQL Database
  - name: autorescue-db
    databaseName: autorescue
    user: autorescue_user
    plan: free
    region: oregon
